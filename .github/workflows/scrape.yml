name: Greater Richmond VA — Motivated Seller Lead Scraper

on:
  schedule:
    # Run daily at 7:00 AM UTC (3:00 AM ET)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Look-back window in days (default: 30). Controls Henrico CAMA date filter."
        required: false
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & Update Records
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Create output directories
        run: mkdir -p data dashboard

      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '30' }}
        run: python scraper/fetch.py

      - name: Verify output files
        run: |
          echo "=== dashboard/records.json ==="
          if [ -f dashboard/records.json ]; then
            python3 -c "
          import json
          d = json.load(open('dashboard/records.json'))
          m = d.get('metadata', {})
          print(f'Total: {m.get(\"total_records\", 0)}')
          print(f'Sources: {m.get(\"sources\", [])}')
          print(f'By type: {m.get(\"by_type\", {})}')
          print(f'By jurisdiction: {m.get(\"by_jurisdiction\", {})}')
          "
          else
            echo "WARNING: dashboard/records.json not found"
            exit 1
          fi
          echo ""
          echo "=== data/leads.csv ==="
          if [ -f data/leads.csv ]; then
            echo "CSV rows: $(wc -l < data/leads.csv)"
          else
            echo "WARNING: data/leads.csv not found"
          fi

      - name: Commit and push updated records
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/records.json data/records.json data/leads.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TOTAL=$(python3 -c "import json; d=json.load(open('dashboard/records.json')); print(d.get('metadata',{}).get('total_records',0))" 2>/dev/null || echo "?")
            git commit -m "chore: scrape update — ${TOTAL} leads — $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

  deploy-dashboard:
    name: Deploy Dashboard to GitHub Pages
    needs: scrape
    runs-on: ubuntu-22.04
    if: success()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pull latest changes (after scrape commit)
        run: git pull --rebase origin main || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
