<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richmond City VA — Motivated Seller Leads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }
    header .badge {
      font-size: 0.75rem;
      background: #16a34a;
      color: #fff;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
    }
    .meta {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .stats {
      display: flex;
      gap: 1rem;
      padding: 1.5rem 2rem;
      flex-wrap: wrap;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.1rem 1.5rem;
      min-width: 160px;
    }
    .stat-card .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.35rem;
    }
    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      padding: 0 2rem 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls input, .controls select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 0.5rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      outline: none;
    }
    .controls input:focus, .controls select:focus {
      border-color: #3b82f6;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .btn-outline:hover { border-color: #64748b; color: #e2e8f0; background: #1e293b; }
    .table-wrap {
      overflow-x: auto;
      padding: 0 2rem 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.825rem;
    }
    thead th {
      background: #1e293b;
      border-bottom: 2px solid #334155;
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { color: #94a3b8; }
    thead th.sorted { color: #60a5fa; }
    tbody tr {
      border-bottom: 1px solid #1e293b;
      transition: background 0.1s;
    }
    tbody tr:hover { background: #1e293b; }
    tbody td {
      padding: 0.6rem 1rem;
      vertical-align: top;
      color: #cbd5e1;
    }
    .score-pill {
      display: inline-block;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      min-width: 2.2rem;
      text-align: center;
    }
    .score-high   { background: #15803d; color: #f0fdf4; }
    .score-mid    { background: #b45309; color: #fef3c7; }
    .score-low    { background: #374151; color: #9ca3af; }
    .flag-badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      margin: 0.1rem;
      background: #1d4ed8;
      color: #bfdbfe;
    }
    .flag-lp    { background: #7c2d12; color: #fed7aa; }
    .flag-fc    { background: #7c2d12; color: #fed7aa; }
    .flag-jud   { background: #4c1d95; color: #ddd6fe; }
    .flag-tax   { background: #7c2d12; color: #fed7aa; }
    .flag-new   { background: #14532d; color: #bbf7d0; }
    .flag-llc   { background: #1e3a5f; color: #bae6fd; }
    .link { color: #60a5fa; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .empty {
      text-align: center;
      padding: 3rem;
      color: #475569;
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 2rem 2rem;
    }
    .page-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.4rem 0.75rem;
      border-radius: 0.4rem;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .page-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .page-btn:hover:not(.active) { background: #334155; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Richmond City, VA &mdash; Motivated Seller Leads</h1>
      <div class="meta" id="meta">Loading...</div>
    </div>
    <div style="display:flex;gap:.75rem;align-items:center">
      <span class="badge" id="total-badge">0 leads</span>
      <button class="btn btn-outline" onclick="exportCSV()">Export GHL CSV</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Leads</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="label">With Address</div>
      <div class="value" id="stat-addr">—</div>
    </div>
    <div class="stat-card">
      <div class="label">High Score ≥70</div>
      <div class="value" id="stat-high">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Date Range</div>
      <div class="value" style="font-size:1rem" id="stat-range">—</div>
    </div>
  </div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search owner, doc #, address..." oninput="applyFilters()" />
    <select id="filter-cat" onchange="applyFilters()">
      <option value="">All types</option>
      <option value="LP">Lis Pendens</option>
      <option value="NOFC">Notice of Foreclosure</option>
      <option value="TAXDEED">Tax Deed</option>
      <option value="JUD">Judgment</option>
      <option value="LNCORPTX">Corp Tax Lien</option>
      <option value="LNIRS">IRS Lien</option>
      <option value="LNFED">Federal Lien</option>
      <option value="LN">Lien</option>
      <option value="LNMECH">Mechanic Lien</option>
      <option value="LNHOA">HOA Lien</option>
      <option value="MEDLN">Medicaid Lien</option>
      <option value="PRO">Probate</option>
      <option value="NOC">Notice of Commencement</option>
      <option value="RELLP">Release Lis Pendens</option>
    </select>
    <select id="filter-score" onchange="applyFilters()">
      <option value="0">All scores</option>
      <option value="50">Score ≥ 50</option>
      <option value="60">Score ≥ 60</option>
      <option value="70">Score ≥ 70</option>
      <option value="80">Score ≥ 80</option>
    </select>
    <select id="sort-field" onchange="applyFilters()">
      <option value="score">Sort: Score ↓</option>
      <option value="filed">Sort: Filed Date ↓</option>
      <option value="amount">Sort: Amount ↓</option>
    </select>
    <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
  </div>

  <div class="table-wrap">
    <table id="leads-table">
      <thead>
        <tr>
          <th>Score</th>
          <th>Flags</th>
          <th>Owner</th>
          <th>Type</th>
          <th>Filed</th>
          <th>Amount</th>
          <th>Property Address</th>
          <th>Mailing Address</th>
          <th>Doc #</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="leads-body">
        <tr><td colspan="10" class="empty">Loading leads...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>

  <script>
    let ALL_RECORDS = [];
    let filtered = [];
    const PER_PAGE = 50;
    let currentPage = 1;

    async function loadData() {
      try {
        const r = await fetch("records.json?_=" + Date.now());
        const data = await r.json();
        ALL_RECORDS = data.records || [];

        document.getElementById("stat-total").textContent = data.total ?? ALL_RECORDS.length;
        document.getElementById("stat-addr").textContent  = data.with_address ?? "—";
        document.getElementById("stat-high").textContent  = ALL_RECORDS.filter(r => (r.score||0) >= 70).length;
        document.getElementById("stat-range").textContent = data.date_range || "—";
        document.getElementById("total-badge").textContent = (data.total || ALL_RECORDS.length) + " leads";

        const fetched = data.fetched_at ? new Date(data.fetched_at).toLocaleString() : "unknown";
        document.getElementById("meta").textContent = "Last updated: " + fetched + "  ·  Source: " + (data.source || "");

        applyFilters();
      } catch(e) {
        document.getElementById("leads-body").innerHTML =
          '<tr><td colspan="10" class="empty">No data yet — run the scraper to populate records.</td></tr>';
        document.getElementById("meta").textContent = "No data loaded.";
      }
    }

    function applyFilters() {
      const q     = document.getElementById("search").value.toLowerCase().trim();
      const cat   = document.getElementById("filter-cat").value;
      const minScore = parseInt(document.getElementById("filter-score").value) || 0;
      const sortF = document.getElementById("sort-field").value;

      filtered = ALL_RECORDS.filter(r => {
        if (cat && r.cat !== cat) return false;
        if ((r.score||0) < minScore) return false;
        if (q) {
          const haystack = [r.owner, r.doc_num, r.prop_address, r.mail_address, r.grantee, r.doc_type]
            .filter(Boolean).join(" ").toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (sortF === "score")  return (b.score||0) - (a.score||0);
        if (sortF === "amount") return (b.amount||0) - (a.amount||0);
        if (sortF === "filed")  return (b.filed||"").localeCompare(a.filed||"");
        return 0;
      });

      currentPage = 1;
      renderTable();
      renderPagination();
    }

    function clearFilters() {
      document.getElementById("search").value = "";
      document.getElementById("filter-cat").value = "";
      document.getElementById("filter-score").value = "0";
      document.getElementById("sort-field").value = "score";
      applyFilters();
    }

    function flagClass(flag) {
      if (flag.includes("Lis pendens") || flag.includes("Pre-foreclosure")) return "flag-lp";
      if (flag.includes("Judgment")) return "flag-jud";
      if (flag.includes("Tax") || flag.includes("IRS") || flag.includes("Mechanic") || flag.includes("Medicaid")) return "flag-tax";
      if (flag.includes("New this week")) return "flag-new";
      if (flag.includes("LLC") || flag.includes("corp")) return "flag-llc";
      return "";
    }

    function scoreClass(s) {
      if (s >= 70) return "score-high";
      if (s >= 50) return "score-mid";
      return "score-low";
    }

    function fmtAmount(a) {
      if (!a && a !== 0) return "—";
      return "$" + Number(a).toLocaleString("en-US", {minimumFractionDigits: 0, maximumFractionDigits: 0});
    }

    function renderTable() {
      const tbody = document.getElementById("leads-body");
      const start = (currentPage - 1) * PER_PAGE;
      const page  = filtered.slice(start, start + PER_PAGE);

      if (page.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty">No records match the current filters.</td></tr>';
        return;
      }

      tbody.innerHTML = page.map(r => {
        const flags = (r.flags || []).map(f =>
          `<span class="flag-badge ${flagClass(f)}">${escHtml(f)}</span>`
        ).join("");

        const propAddr  = [r.prop_address, r.prop_city, r.prop_state, r.prop_zip].filter(Boolean).join(", ");
        const mailAddr  = [r.mail_address, r.mail_city, r.mail_state, r.mail_zip].filter(Boolean).join(", ");
        const link = r.clerk_url
          ? `<a class="link" href="${escHtml(r.clerk_url)}" target="_blank" rel="noopener">View ↗</a>`
          : "—";

        return `<tr>
          <td><span class="score-pill ${scoreClass(r.score||0)}">${r.score||0}</span></td>
          <td>${flags || "—"}</td>
          <td>${escHtml(r.owner||"—")}</td>
          <td>${escHtml(r.cat_label||r.cat||"—")}</td>
          <td>${escHtml(r.filed||"—")}</td>
          <td>${fmtAmount(r.amount)}</td>
          <td>${escHtml(propAddr||"—")}</td>
          <td>${escHtml(mailAddr||"—")}</td>
          <td style="font-family:monospace;font-size:.75rem">${escHtml(r.doc_num||"—")}</td>
          <td>${link}</td>
        </tr>`;
      }).join("");
    }

    function renderPagination() {
      const total = Math.ceil(filtered.length / PER_PAGE);
      const pg = document.getElementById("pagination");
      if (total <= 1) { pg.innerHTML = ""; return; }

      let html = "";
      for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn${i === currentPage ? " active" : ""}" onclick="goPage(${i})">${i}</button>`;
      }
      pg.innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      renderTable();
      renderPagination();
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function exportCSV() {
      const cols = [
        "First Name","Last Name","Mailing Address","Mailing City","Mailing State","Mailing Zip",
        "Property Address","Property City","Property State","Property Zip",
        "Lead Type","Document Type","Date Filed","Document Number",
        "Amount/Debt Owed","Seller Score","Motivated Seller Flags","Source","Public Records URL"
      ];
      function splitName(n) {
        const p = (n||"").trim().split(/\s+/);
        if (!p.length) return ["",""];
        if (p.length === 1) return [p[0],""];
        return [p.slice(0,-1).join(" "), p[p.length-1]];
      }
      const rows = [cols.join(",")];
      (filtered.length ? filtered : ALL_RECORDS).forEach(r => {
        const [fn, ln] = splitName(r.owner);
        const row = [
          fn, ln,
          r.mail_address||"", r.mail_city||"", r.mail_state||"", r.mail_zip||"",
          r.prop_address||"", r.prop_city||"", r.prop_state||"", r.prop_zip||"",
          r.cat_label||r.cat||"", r.doc_type||"", r.filed||"", r.doc_num||"",
          r.amount||"", r.score||0,
          (r.flags||[]).join("; "),
          "Richmond City, VA - Circuit Court",
          r.clerk_url||""
        ].map(v => `"${String(v).replace(/"/g,'""')}"`);
        rows.push(row.join(","));
      });
      const blob = new Blob([rows.join("\n")], {type:"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "richmond_va_motivated_sellers_" + new Date().toISOString().slice(0,10) + ".csv";
      a.click();
    }

    function escHtml(str) {
      return String(str||"")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    loadData();
  </script>
</body>
</html>
